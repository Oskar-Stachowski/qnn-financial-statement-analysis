audit_id: research_universe_registrant_role_economic_entity_v1
purpose: >-
  Manual resolutions for joint-filing statement scopes that cannot be mapped
  safely from XBRL entity identifiers alone. Decisions use the primary
  original 10-K only and never target values or model results. This includes
  every non-XBRL joint accession and XBRL edge cases where one package contains
  multiple separately audited annual statement suites.

