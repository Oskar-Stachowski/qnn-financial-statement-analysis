schema_version: 1

label_access_manifest:
  id: protected_period_label_reveal_access_manifest
  version: 1.0.0
  gate: DATA_ACCESS_GATE_2023_2024_LABEL_REVEAL_V1
  protected_label_years: [2023, 2024]
  arbitrary_paths_allowed: false
  one_shot_evaluation_required: true
  rerun_after_terminal_state_allowed: false

authority:
  subject_commit: bebd35bd2e7f76ebcae0da6716e8aea1659405fe
  decision_sha256: 864cd99661a6afbbb44e1c3096d5400e46b6f1062c00f843324c56d7e41bba23
  p1_contract_sha256: 3d4e90f7c034d8610680f48f86951a6182b3ef5809004d4f0269f0be1f7cc53b
  execution_repair_sha256: cdfb21fb5aac74cba6987dfd65591e77afff13d44eba77001a1bad1a705740f4
  runner_evaluator_reporter_verifier_sha256: 8711d03b95bd15ef95d697f8036933d79e889e5e5fb1638f09a8df91bda5388b
  feature_access_manifest_sha256: 130425486b909a84e608212aef25251128a9faf303aab26aaba6ae9933f381c8
  prediction_evidence_sha256: 1f0951b6e6fc26cb2faf6f184c99a7a4fe215d5326d9719f0ff6424a020dc885
  feature_execution_audit_sha256: 9380bafba455a6a18c563148a50079aa3fefa1663ac5ae217408c3458c408660
  corrected_holdout_x_t_sha256: e0913046699ac9641bccbb165f86f09d43ba65f530b2eba5cc14e50e2d1f406f
  research_universe_sha256: a91a7fd1b985898f8158a130bb822723baa378e952c653d7fe4f3650731a2b1f

gate:
  id: DATA_ACCESS_GATE_2023_2024_LABEL_REVEAL_V1
  status: committed_candidate_not_executed
  pass_unlocks_only: LABEL_POST_GATE_EVALUATION_SCOPE_V1_0_0
  prediction_hashes_must_preexist: true
  result_may_change_methodology: false

scopes:
  label_gate_verifier_scope:
    id: LABEL_GATE_VERIFIER_SCOPE_V1_0_0
    definition_sha256: 074a19b5af21b8d7e8d2f2faa2cbad0b4ccceff6a47c4cedba40231359efabaa
    definition:
      command: .venv-classical/bin/python -m src.modeling.protected_period_extension verify-label-gate
      exact_content_reads:
        - configs/protected_period_label_access_manifest_v1_0_0.yaml
        - configs/protected_period_label_access_review_v1_0_0_result.json
        - configs/protected_period_execution_contract_v1_0_0.yaml
        - configs/protected_period_execution_repair_v1_0_1.yaml
        - configs/protected_period_feature_execution_v1_0_0_result.json
        - configs/protected_period_feature_execution_audit_v1_0_0_result.json
        - src/modeling/protected_period_extension.py
      opaque_sha256_and_existence_only:
        - data/model_runs/protected_period_extension_v1/holdout_blind/predictions
        - data/protected_period_extension_v1/holdout/x_t_v1_1_corrected_through_2024.csv
        - data/processed/research_universe.csv
      exact_directory_existence_only:
        - data/raw/companyfacts
        - data/raw/sec_submissions
        - data/raw/sec_filings/revenue_statement_evidence
      output: configs/protected_period_label_gate_v1_0_0_result.json
      forbidden:
        - label_deserialization_2023_2024
        - target_build_2023_2024
        - target_row_count_or_statistics_read
        - prediction_change
        - model_fit
        - metric_evaluation

  label_post_gate_evaluation_scope:
    id: LABEL_POST_GATE_EVALUATION_SCOPE_V1_0_0
    definition_sha256: 44751fc1d827520bcb164dd2a5a9f3c8fbdb18dbad6a3c46dc84245a083a2da5
    definition:
      command: .venv-classical/bin/python -m src.modeling.protected_period_extension evaluate-holdout
      exact_inputs:
        - configs/protected_period_label_access_manifest_v1_0_0.yaml
        - configs/protected_period_label_access_review_v1_0_0_result.json
        - configs/protected_period_label_gate_v1_0_0_result.json
        - configs/protected_period_execution_contract_v1_0_0.yaml
        - configs/protected_period_execution_repair_v1_0_1.yaml
        - configs/protected_period_feature_execution_v1_0_0_result.json
        - configs/protected_period_feature_execution_audit_v1_0_0_result.json
        - data/model_runs/protected_period_extension_v1/holdout_blind/predictions
        - data/protected_period_extension_v1/holdout/x_t_v1_base_through_2024.csv
        - data/protected_period_extension_v1/holdout/x_t_v1_1_corrected_through_2024.csv
        - data/processed/research_universe.csv
        - data/raw/companyfacts
        - data/raw/sec_submissions
        - data/raw/sec_filings/revenue_statement_evidence
      allowed_operations:
        - build_target_candidate_v2_pit_b_for_feature_years_2023_2024_once
        - apply_frozen_v1_1_resolver_correction
        - fail_if_cross_tag_pair_audit_finds_newly_blocked_pair
        - align_frozen_blind_predictions_to_available_labels
        - frozen_metric_evaluation
        - economic_group_cluster_bootstrap_2000_seed_20260818
        - write_prior_exposure_disclosure
        - write_terminal_one_shot_state
      exact_output_roots:
        - data/protected_period_extension_v1/holdout
        - data/model_runs/protected_period_extension_v1/holdout_evaluation
      exact_committed_outputs:
        - configs/protected_period_holdout_evaluation_v1_0_0_result.json
        - reports/protected_period_extension_v1/holdout_report_v1_0_0.json
      mandatory_report_properties:
        fully_unseen_claimed: false
        prior_exposure_disclosure_required: true
        selection_or_tuning_performed: false
      forbidden:
        - rerun_after_terminal_complete_or_failed_state
        - tuning
        - reselection
        - recalibration
        - rethresholding
        - prediction_change
        - methodology_change_based_on_result
        - fully_unseen_claim

  label_post_evaluation_freeze_scope:
    id: LABEL_POST_EVALUATION_FREEZE_SCOPE_V1_0_0
    definition_sha256: 3dc7ebb856e1930355a7b5440348c184768161f9bf1858086440b07c7b7a546e
    definition:
      command: .venv-classical/bin/python -m src.modeling.protected_period_extension verify-holdout-freeze
      exact_inputs:
        - configs/protected_period_label_access_manifest_v1_0_0.yaml
        - configs/protected_period_label_access_review_v1_0_0_result.json
        - configs/protected_period_holdout_evaluation_v1_0_0_result.json
        - reports/protected_period_extension_v1/holdout_report_v1_0_0.json
        - data/model_runs/protected_period_extension_v1/holdout_evaluation/one_shot_execution_state.json
        - data/model_runs/protected_period_extension_v1/holdout_evaluation/labeled_predictions
        - data/model_runs/protected_period_extension_v1/holdout_blind/predictions
      allowed_operations:
        - json_deserialize
        - exact_prediction_label_evaluator_and_report_hash_verification
        - full_roster_and_output_completeness_check
        - one_shot_terminal_state_check
        - mandatory_prior_exposure_disclosure_check
        - no_methodology_change_check
      output: configs/protected_period_holdout_freeze_v1_0_0_result.json
      forbidden:
        - report_or_prediction_repair
        - model_fit
        - new_prediction
        - new_evaluation
        - tuning
        - methodology_change

review_scope:
  exact_content_paths:
    - configs/protected_period_label_access_manifest_v1_0_0.yaml
    - configs/protected_period_execution_contract_v1_0_0.yaml
    - configs/protected_period_execution_repair_v1_0_1.yaml
    - configs/protected_period_feature_execution_v1_0_0_result.json
    - configs/protected_period_feature_execution_audit_v1_0_0_result.json
    - src/modeling/protected_period_extension.py
  protected_label_content_or_statistics_read_allowed: false
  gate_execution_allowed: false
  evaluation_allowed: false
