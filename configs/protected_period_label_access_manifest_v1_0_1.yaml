    definition_sha256: f1bd52612f818bb92abc526ba4faba90e9668386e2ceedd1c5db404b4656738c
    definition:
      command: .venv-classical/bin/python -m src.modeling.protected_period_extension verify-label-gate
      exact_content_reads:
        - configs/protected_period_label_access_manifest_v1_0_1.yaml
        - configs/protected_period_label_access_review_v1_0_1_result.json
        - configs/protected_period_execution_contract_v1_0_0.yaml
        - configs/protected_period_execution_repair_v1_0_1.yaml
        - configs/protected_period_holdout_evaluation_repair_v1_0_1.yaml
        - configs/protected_period_holdout_evaluation_failure_v1_0_0_result.json
        - configs/protected_period_label_access_manifest_v1_0_0.yaml
        - configs/protected_period_label_gate_v1_0_0_result.json
        - configs/protected_period_feature_execution_v1_0_0_result.json
        - configs/protected_period_feature_execution_audit_v1_0_0_result.json
        - src/modeling/protected_period_extension.py
        - tests/test_protected_period_holdout_evaluation_repair.py
      opaque_sha256_and_existence_only:
        - data/model_runs/protected_period_extension_v1/holdout_blind/predictions
        - data/protected_period_extension_v1/holdout/x_t_v1_1_corrected_through_2024.csv
        - data/processed/research_universe.csv
      output: configs/protected_period_label_gate_recheck_v1_0_1_result.json
      required_disclosures:
        labels_opened_before_initial_pass: false
        labels_opened_before_recheck: true
        performance_metrics_computed_before_recheck: false
      forbidden:
        - further_label_deserialization_2023_2024
        - target_rebuild_2023_2024
        - target_row_count_or_statistics_read
        - prediction_change
        - model_fit
        - metric_evaluation

  label_post_gate_evaluation_scope:
    id: LABEL_POST_GATE_EVALUATION_SCOPE_V1_0_1
    definition_sha256: 3148336b2ca46529973d22feb6c92f4b4ae8473f70681ff6a37c16cfaa1a21e7
    definition:
      command: .venv-classical/bin/python -m src.modeling.protected_period_extension evaluate-holdout
      exact_inputs:
        - configs/protected_period_label_access_manifest_v1_0_1.yaml
        - configs/protected_period_label_access_review_v1_0_1_result.json
        - configs/protected_period_label_gate_recheck_v1_0_1_result.json
        - configs/protected_period_label_gate_v1_0_0_result.json
        - configs/protected_period_execution_contract_v1_0_0.yaml
        - configs/protected_period_execution_repair_v1_0_1.yaml
        - configs/protected_period_holdout_evaluation_repair_v1_0_1.yaml
        - configs/protected_period_holdout_evaluation_failure_v1_0_0_result.json
        - configs/protected_period_feature_execution_v1_0_0_result.json
        - configs/protected_period_feature_execution_audit_v1_0_0_result.json
        - data/model_runs/protected_period_extension_v1/holdout_blind/predictions
        - data/protected_period_extension_v1/holdout/x_t_v1_base_through_2024.csv
        - data/protected_period_extension_v1/holdout/x_t_v1_1_corrected_through_2024.csv
        - data/processed/research_universe.csv
        - data/raw/companyfacts
        - data/raw/sec_submissions
        - data/raw/sec_filings/revenue_statement_evidence
      allowed_operations:
        - rebuild_frozen_target_candidate_v2_pit_b_for_feature_years_2023_2024
        - apply_frozen_v1_1_resolver_correction
        - fail_if_cross_tag_pair_audit_finds_newly_blocked_pair
        - realign_unchanged_blind_predictions_to_available_labels
        - serialize_labeled_predictions_into_year_partitions
        - frozen_metric_evaluation
        - economic_group_cluster_bootstrap_2000_seed_20260818
        - write_mandatory_pre_metric_failure_and_prior_exposure_disclosure
        - write_new_terminal_one_shot_state
      exact_output_roots:
        - data/protected_period_extension_v1/holdout
        - data/model_runs/protected_period_extension_v1/holdout_evaluation_v1_0_1
      exact_committed_outputs:
        - configs/protected_period_holdout_evaluation_v1_0_1_result.json
        - reports/protected_period_extension_v1/holdout_report_v1_0_1.json
      mandatory_report_properties:
        fully_unseen_claimed: false
        prior_label_exposure_and_pre_metric_failure_disclosure_required: true
        selection_or_tuning_performed: false
      forbidden:
        - modify_or_delete_failed_v1_0_0_evidence
        - rerun_after_terminal_complete_or_failed_v1_0_1_state
        - tuning
        - reselection
        - recalibration
        - rethresholding
        - blind_prediction_change
        - model_refit
        - metric_or_bootstrap_change
        - methodology_change_based_on_result
        - fully_unseen_claim

