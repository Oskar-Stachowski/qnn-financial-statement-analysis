    - accession
    - cik10
    - feature_year
    - company_name_historical
    - historical_sic
    - historical_sic_description
    - historical_sic_source
    - research_sector
    - membership_status
    - membership_reason
    - filed
    - accepted_at
    - membership_available_at
    - registrant_role_resolved
    - economic_statement_scope_id
    - economic_group_id
    - representative_cik
    - linked_co_registrant_ciks
    - resolution_evidence
    - in_old_current_snapshot_universe
    - recovered_vs_old_universe
    - later_inactive_delisted_or_unmapped_proxy
    - development_or_test
    - xbrl_submission_available
  known_test_operations:
    - full_csv_deserialization
    - eligible_membership_filter
    - total_eligible_row_count_assertion
    - duplicate_identity_check
    - sort_and_head_one_after_full_deserialization
  exact_protected_row_count: not_reopened_to_determine
  exact_protected_values_rendered_to_agent_output: false
  potentially_exposed_in_process_categories:
    - row_level_company_year_identity
    - historical_entity_and_industry_metadata
    - membership_status_and_reason
    - filing_and_availability_timestamps
    - economic_entity_resolution_metadata
    - xbrl_availability
