    - model_performance
    - hyperparameter_results
    - calibration_or_threshold_results
  scope_limit_reason: further_data_inspection_is_forbidden_and_would_compound_the_incident

decision_contamination:
  protected_values_used_for_methodology: false
  protected_values_used_for_model_selection: false
  protected_values_used_for_preprocessing_or_sample_design: false
  protected_values_used_for_results_interpretation: false
  new_methodological_decisions_taken_after_exposure: false
  models_trained_on_project_data: false
  new_predictions_generated: false
  formal_step_7_verdict_may_be_passed_in_affected_run: false

containment:
  guarded_suite_stopped: true
  development_only_suite_started: false
  protected_test_reexecuted: false
  further_protected_content_inspection_executed: false
  offending_test_reclassified_as_protected_gated: true
  offending_test_removed_from_all_runnable_profiles: true
  project_model_training_executed: false
  frozen_manifests_or_result_artifacts_modified: false
  methodology_modified: false
  protected_values_reproduced_in_declaration: false
  step_7b_or_step_7c_started_after_detection: false

independent_review_control:
  allowlist_path: configs/data_access_incident_v1_2_0_review_allowlist.yaml
  review_must_use_fresh_context_or_independent_reviewer: true
  current_exposed_context_may_self_close_incident: false
  review_completed: false
  review_evidence_path: not_yet_created
  user_same_session_step_7_review_exception_does_not_cover_incident_resolution: true

required_resolution:
  - commit_this_successor_incident_declaration_and_review_allowlist
  - verify_the_declaration_in_a_fresh_context_or_by_an_independent_reviewer
  - use_only_the_exact_files_and_operations_in_the_committed_review_allowlist
  - do_not_read_data_or_reports_content_during_incident_review
  - keep_the_offending_test_protected_gated_until_a_new_reviewed_train_only_fixture_exists
  - restart_step_7a_from_a_clean_committed_baseline_after_incident_review
  - do_not_reuse_any_protected_metadata_deserialized_by_the_affected_process

resolution_state:
  containment_complete: true
  successor_declaration_created: true
  independent_review_complete: false
  incident_resolved: false
  step_7_may_resume: false
  protected_period_gate_may_be_relied_upon: false

change_control:
  this_declaration_changes_methodology: false
  this_declaration_authorizes_protected_data_access: false
  this_declaration_authorizes_model_training: false
  this_declaration_resolves_prior_incidents: false
  any_scope_correction_requires_new_incident_version: true
  historical_declarations_manifests_and_frozen_artifacts_may_be_edited_in_place: false

notes:
  - No protected values are reproduced in this declaration.
  - Column and operation scope comes only from the already-authorized test and source-code inspection.
  - This declaration records containment; it cannot be self-reviewed in the exposed session.

