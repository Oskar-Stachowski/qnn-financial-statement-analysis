findings:
  blocker:
    - id: BLOCKER-001
      area: final_thesis_package
      evidence: >-
        thesis/Praca Magisterska Oskar Stachowski os109908.docx contains only
        the title page, table of contents and empty section headings (442 words
        in extracted text); chapters, introduction, conclusion, bibliography,
        lists and abstract are not integrated.
      required_closure: >-
        Assemble a submission candidate and verify its rendered pagination,
        cross-references, tables, figures, bibliography and required front/back matter.
    - id: BLOCKER-002
      area: results_chapter
      evidence: >-
        Rozdzial_5_Ewaluacja_modeli.docx states that refinement, QNN,
        confirmation, calibration, robustness and interpretability are not yet
        complete and contains multiple DO UZUPEŁNIENIA blocks, while all those
        development stages are now frozen and verified.
      required_closure: >-
        Replace the stale status and placeholders with author-written analysis
        based strictly on the frozen primary and secondary evidence packages.
    - id: BLOCKER-003
      area: target_definition_in_thesis
      evidence: >-
        Chapter 1 describes a positive label as deterioration in at least two
        of three dimensions, inconsistent with the frozen D1-D5 rule requiring
        deterioration_score_1y >= 3.
      required_closure: >-
        Align every conceptual and methodological target description to the
        exact frozen five-signal definition without changing the frozen target.
    - id: BLOCKER-004
      area: methodology_chapter
      evidence: >-
        Chapter 4 says the repository still lacks a complete ranking,
        calibrators and thresholds and describes the runner as not yet fully
        executed; those statements are superseded by verified v1.3.0 and v1.1.7 results.
      required_closure: >-
        Update the chapter to the executed frozen state, preserve development-only
        limitations and remove obsolete current-state assertions.
    - id: BLOCKER-005
      area: qnn_chapter_editorial_completeness
      evidence: >-
        The current Chapter 3 PDF still contains the instruction that VQC must
        be defined, and identifies an AI-generated illustration rather than a
        finished author-controlled passage and final figure record.
      required_closure: >-
        Finish the VQC section and resolve the illustration under the separate
        author/AI-compliance process; this audit does not infer that gate's status.
  important:
    - id: IMPORTANT-001
      area: statistical_reporting_contract
      evidence: >-
        Calibration and threshold identities and hashes are complete, but the
        current thesis methodology itself says the full Brier/log-loss,
        calibration intercept/slope, confusion-matrix, precision, recall,
        specificity and F1 reporting contract is not yet frozen or integrated.
      recommendation: >-
        Freeze a thesis-facing reporting schema before later-period gates and
        populate it from already authorized evidence or mark unavailable fields explicitly.
    - id: IMPORTANT-002
      area: inference_limits
      evidence: >-
        The paired 2,000-replicate clustered bootstrap covers the neural
        comparison but is conditional on selected configurations and does not
        adjust for model selection or multiple comparisons.
      recommendation: >-
        Keep claims descriptive/conditional and avoid p-value or definitive
        superiority language; do not retrofit a post-hoc significance claim.
    - id: IMPORTANT-003
      area: test_baseline
      evidence: >-
        Step 6 authorizes only named safe verifiers. It therefore establishes
        no current full-suite count and does not reuse the invalid historical
        14-failures/305-passed baseline.
      recommendation: >-
        Use the next test-access-manifest step before a complete release test run.
    - id: IMPORTANT-004
      area: superseded_period_terminology
      evidence: >-
        Older frozen pipeline documentation still calls 2021-2022 one-shot
        external validation, while the controlling policy and current README
        correctly classify it as design-exposed spent development.
      recommendation: >-
        Make the supersession explicit wherever older documents are cited and
        use only the controlling period terminology in the thesis.
  optional:
    - id: OPTIONAL-001
      area: neural_comparator_naming
      recommendation: >-
        Explain that the supplemental MLP was selected from the combined coarse
        plus refinement pool even though the winning configuration identity has stage coarse.
    - id: OPTIONAL-002
      area: evidence_integration
      recommendation: >-
        Add provenance notes linking each final table and figure to the frozen
        report/manifest version and keep single-seed versus three-seed comparisons labelled descriptive.

