metric_aggregation:
  primary_ranking:
    name: pooled_oof_pr_auc
    oof_validation_feature_years: [2015, 2020]
    pooling: concatenate_all_oof_rows_before_metric
    direction: higher_is_better
  required_additional_reporting:
    per_fold_metric: pr_auc
    mean: arithmetic_mean_across_six_fold_values
    standard_deviation: sample_standard_deviation
    standard_deviation_ddof: 1
  secondary_metrics_may_change_primary_ranking: false

inference:
  method: clustered_bootstrap
  cluster_column: economic_group_id
  cluster_column_is_predictor: false
  resampling_unit: unique_economic_group
  preserve_all_rows_and_draw_multiplicity_within_sampled_group: true
  replicates: 2000
  confidence_level: 0.95
  interval: percentile
  lower_quantile: 0.025
  upper_quantile: 0.975
  random_seed: 20260818
  row_level_bootstrap_allowed_as_primary_ci: false
  degenerate_single_class_draw_policy: redraw_deterministically_and_report_rejection_count

mandatory_ablations_and_robustness:
  B_without_missing_indicators:
    type: ablation
    same_main_rows: true
    missing_indicators_enabled: false
    all_other_main_preprocessing_unchanged: true
    may_replace_primary_ranking: false
  complete_case:
    type: robustness
    block_specific: true
    exclude_row_if_any_feature_in_evaluated_block_is_missing: true
    alternative_main_sample_policy: false
    may_replace_primary_ranking: false
  no_winsorization:
    type: robustness
    same_main_rows: true
    winsorization_enabled: false
    median_imputation_enabled: true
    missing_indicators_enabled: true
    scaling_enabled: true
    may_replace_primary_ranking: false
  purged_economic_group_cv:
    type: robustness
    temporal_folds_unchanged: true
    remove_from_fold_train_groups_present_in_fold_validation: true
    validation_rows_changed: false
    alternative_estimand: unseen_economic_group_generalization
    may_replace_primary_ranking: false
  sparse_row:
    type: robustness
    count_source: raw_pre_imputation_frozen_financial_features
    feature_count_total: 17
    exclusion_rule: available_feature_count <= 10
    retention_rule: available_feature_count >= 11
    apply_to_train_and_evaluation_partitions_in_robustness_rerun: true
    main_supervised_sample_unchanged: true
    alternative_main_sample_policy: false
    may_replace_primary_ranking: false
    test_results_may_select_or_activate_this_policy: false

selection_bias_policy:
  required_descriptive_strata:
    - feature_year
    - research_sector
    - time_t_size
    - x_t_status
    - xbrl_availability
    - available_feature_count
    - target_class
  non_xbrl_rows_enter_model_matrix: false
  scope_claim: conditional_on_available_target_and_accepted_x_t_status
  ipw:
    status: diagnostic_evaluated_and_rejected
    reason:
      - poor_positivity
      - extreme_weights
      - low_effective_sample_size
      - nonuniform_balance
      - time_t_covariates_do_not_support_mar_for_t_plus_1_availability
      - cannot_recover_non_xbrl_or_unavailable_x_t_support
    target_availability_candidate_population_n: 43175
    selected_n: 19671
    candidate_propensity_below_0_05_n: 4524
    selected_propensity_below_0_05_n: 358
    untruncated_effective_sample_size: 518.821
    stabilized_p1_p99_effective_sample_size: 1889.230
    ipw_weighted_predictive_metrics_allowed: false

external_validation:
  feature_years: [2021, 2022]
  n: 3547
  role: one_shot_no_tune_external_development_validation
  may_be_opened_before_full_model_stage_lock: false
  pipeline_or_models_may_be_tuned_after_results_and_retain_independent_status: false
