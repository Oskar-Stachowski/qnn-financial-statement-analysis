scope:
  development_feature_years: [2011, 2022]
  train_feature_years: [2011, 2020]
  external_validation_feature_years: [2021, 2022]
  test_feature_years: [2023, 2024]
  test_used_for_pipeline_design_or_freeze: false
  external_validation_target_values_or_financial_features_used_for_pipeline_freeze: false
  external_validation_minimal_index_and_count_check_allowed: true

supervised_sample:
  unit: eligible_company_year
  required_membership_status: eligible
  required_target_status: available
  allowed_x_t_statuses:
    - available_core
    - partially_available
  missing_financial_feature_drops_main_row: false
  development_n: 23218
  train_n: 19671
  external_validation_n: 3547
  membership_fingerprint:
    algorithm: sha256_utf8_lf_sorted_unique_research_universe_company_year_id
    development: e2ea8b25ce703576de06467664be830423043bb3341ab626f6e6255723fd8124
    train: 864af3d9aac6ea239d993ea48cd819c2185f3249957d8b81f6d8d4c3c9f3d680
    external_validation: c0f69d25f018a85ea35c82e18070cbee5a7acd38d9db86ab3253c9c88f7c6a5f

feature_blocks:
  L:
    - log_assets_t
    - roa_t
    - ocf_to_assets_t
    - current_ratio_t
    - liabilities_to_assets_t
    - working_capital_to_assets_t
    - accruals_to_assets_t
  D:
    - asset_growth_1y
    - delta_roa_1y
    - delta_ocf_to_assets_1y
    - current_ratio_change_1y
    - delta_liabilities_to_assets_1y
  R:
    - log1p_revenues_t
    - profit_margin_t
    - ocf_margin_t
    - asset_turnover_t
    - revenue_growth_1y
  frozen_comparisons:
    - [L]
    - [L, D]
    - [L, D, R]
  same_main_sample_for_all_comparisons: true
  missing_r_feature_drops_main_row: false
  economic_group_id_is_predictor: false

preprocessing:
  main_variant:
    id: C
    fit_scope: train_partition_only
    cv_fit_scope: fold_train_partition_only
    validation_operation: transform_only
    fresh_instance_per_fold_and_feature_block: true
    financial_branch_order:
      - winsorize
      - median_impute
      - standard_scale
    winsorization:
      enabled: true
      per_feature: true
      lower_quantile: 0.01
      upper_quantile: 0.99
      fit_on_observed_train_values_only: true
    imputation:
      method: median
      per_feature: true
      fit_on_train_only: true
      drops_rows: false
    scaling:
      implementation: StandardScaler
      center: mean_after_winsorization_and_imputation
      scale: population_standard_deviation
      ddof: 0
      financial_features_only: true
      fit_on_train_only: true
    missing_indicators:
      enabled: true
      one_per_input_financial_feature: true
      source: raw_pre_imputation_missingness
      suffix: __missing
      values: [0, 1]
      winsorized: false
      scaled: false
      appended_after_scaled_financial_features: true

