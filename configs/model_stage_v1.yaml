  inference:
    method: clustered_bootstrap
    cluster: economic_group_id
    replicates: 2000
    interval: 95_percent_percentile
    seed: 20260818

model_roster:
  included:
    - dummy_prior
    - fixed_l2_logistic
    - elastic_net_logistic
    - rbf_svm
    - random_forest
    - hist_gradient_boosting
    - xgboost
    - pytorch_mlp
    - qnn_if_technically_feasible
  documented_omissions:
    LDA: linear_role_covered_by_logistic_and_covariance_assumptions_unattractive_with_indicators
    decision_tree: high_temporal_variance_and_tree_family_covered_by_RF_HistGB_XGBoost
    LightGBM: earlier_XGBoost_or_LightGBM_alternative_instantiated_as_XGBoost
  roster_may_change_after_validation: false

