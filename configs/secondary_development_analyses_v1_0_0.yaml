secondary_development_analyses:
  id: secondary_development_analyses_v1_0_0
  version: 1.0.0
  created_on: "2026-08-23"
  status: pre_execution_package_frozen_before_project_data_analysis
  default_output_root: data/model_runs/secondary_development_v1_0_0

  scientific_role:
    scope: secondary_development_only
    oof_validation_years: [2015, 2016, 2017, 2018, 2019, 2020]
    permitted_feature_year_bounds: [2011, 2020]
    protected_feature_years: [2021, 2022, 2023, 2024]
    may_change_primary_ranking: false
    may_change_roster: false
    may_change_ansatz: false
    may_change_hyperparameters: false
    may_change_preprocessing_or_target_definition: false
    may_change_calibration_or_threshold: false
    quantum_advantage_claim_allowed: false

  authority:
