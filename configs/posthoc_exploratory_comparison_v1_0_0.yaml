schema_version: 1

analysis:
  id: posthoc_exploratory_comparison_v1_0_0
  version: 1.0.0
  created_on: "2026-08-25"
  status: AUTHOR_AUTHORIZED_POST_HOC_EXPLORATORY
  same_session_scope_review: true
  project_model_fit_permitted: false
  prediction_generation_permitted: false
  hyperparameter_search_permitted: false
  additional_seeds_permitted: false
  protected_or_holdout_content_permitted: false
  development_feature_years: [2015, 2016, 2017, 2018, 2019, 2020]
  forbidden_feature_years: [2021, 2022, 2023, 2024]
  expected_rows: 10760
  expected_positive_n: 1986
  expected_seed: 20260818

bootstrap:
  resampling_unit: economic_group_id
  paired_cluster_draws_across_models: true
  clusters_sampled_with_replacement: true
  replicates: 2000
  minimum_valid_replicates: 1900
  confidence_level: 0.95
  interval: percentile
  percentiles: [2.5, 97.5]
  numpy_percentile_method: linear
  seed: 20260818
  selection_adjusted: false
  confirmatory_claim_permitted: false

comparisons:
  tree_models:
    - id: xgboost_minus_hist_gradient_boosting
      model_a: xgboost
      model_b: hist_gradient_boosting
    - id: xgboost_minus_random_forest
      model_a: xgboost
      model_b: random_forest
  seed_matched_qnn_controls:
    - id: qnn_minus_pca_matched_mlp
      model_a: qnn_seed_20260818
      model_b: pca_matched_mlp_seed_20260818
      request_mapping: EXACT_REQUESTED_CONTROL
    - id: qnn_minus_pca_matched_fixed_l2_logistic
      model_a: qnn_seed_20260818
      model_b: pca_matched_fixed_l2_logistic_seed_20260818
      request_mapping: EXISTING_FIXED_L2_LOGISTIC_CONTROL_NOT_FIXED_L2_MLP

