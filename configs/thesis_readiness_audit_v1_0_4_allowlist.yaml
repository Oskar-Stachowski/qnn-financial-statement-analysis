      new_context_required: false
      retry_same_exact_path_with_smaller_output_allowed: true
      scope_expansion_allowed: false
    audit_process_nonconformance:
      allowed_contexts: [audit_executor_after_review_pass]
      classification: non_analytical_process_nonconformance
      exact_output_route_reference: audit_scope.exact_write_allowlist_for_audit
      mandatory_operations:
        - stop_current_operation
        - write_exact_audit_output_file
        - git_diff_exact_audit_output_files
        - commit_exact_audit_output_files
      required_record_status: AUDIT_ABORTED_NO_READINESS_VERDICT
      existing_allowlist_input_modified: false
    unexpected_content_exposure_incident:
      allowed_contexts: [allowlist_review, audit_executor_after_review_pass]
      classification: unexpected_protected_or_analytical_content_exposure
      exact_output_route_reference: audit_scope.exact_write_allowlist_for_unexpected_content_incident
      mandatory_operations:
        - stop_current_operation
        - write_exact_unexpected_content_incident_output_file
        - git_diff_exact_unexpected_content_incident_output_files
        - commit_exact_unexpected_content_incident_output_files
      required_record_status: INCIDENT_DECLARATION_REQUIRED_REVIEW_OR_AUDIT_INVALIDATED
      review_or_audit_verdict_output_may_be_written: false
      protected_content_may_be_reopened_to_complete_record: false
  mandatory_trigger_routes:
    allowlist_review:
      unexpected_protected_or_analytical_content: unexpected_content_exposure_incident
      unlisted_path_required_without_content_exposure: review_process_nonconformance
      hash_or_inventory_mismatch_without_content_exposure: review_process_nonconformance
      schema_or_row_count_disclosure_risk_before_exposure: review_process_nonconformance
      allowlist_violation_without_content_exposure: review_process_nonconformance
      allowlist_violation_with_content_exposure: unexpected_content_exposure_incident
      ambiguous_period_boundary_without_content_exposure: review_process_nonconformance
      output_cap_exceeded_without_content_exposure: retryable_review_output_nonconformance
    audit_executor_after_review_pass:
      unexpected_protected_or_analytical_content: unexpected_content_exposure_incident
      unlisted_path_required_without_content_exposure: audit_process_nonconformance
      hash_or_inventory_mismatch_without_content_exposure: audit_process_nonconformance
      schema_or_row_count_disclosure_risk_before_exposure: audit_process_nonconformance
      allowlist_violation_without_content_exposure: audit_process_nonconformance
      allowlist_violation_with_content_exposure: unexpected_content_exposure_incident
      ambiguous_period_boundary_without_content_exposure: audit_process_nonconformance
      output_cap_exceeded_without_content_exposure: retryable_audit_output_nonconformance
  incident_record_may_include_values: false
  incident_record_minimum_fields:
    - timestamp
    - exact_path
    - exact_operation
    - exposure_category_without_values
    - containment_actions
  nonconformance_record_may_include_protected_or_analytical_values: false
  readiness_verdict_after_fatal_stop_allowed: false
  readiness_verdict_after_retryable_command_stop_and_compliant_retry_allowed: true
