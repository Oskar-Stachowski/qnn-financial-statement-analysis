entry_conditions_for_audit:
  required_allowlist_review_verdict: ALLOWLIST_REVIEW_PASS
  review_evidence_must_be_committed: true
  audit_requires_new_fresh_context_after_review: false
  audit_may_run_in_same_context_after_review_commit: true
  audit_must_follow_separate_review_commit: true
  audit_may_start_before_review_commit: false
  audit_must_use_this_committed_version_without_changes: true
  any_scope_or_operation_change_requires_new_allowlist_version_and_review: true
  unresolved_review_finding_blocks_audit: true
  this_preparation_context_may_execute_audit_after_review_commit: true

allowlist_review_execution_policy:
  accepted_review_modes:
    - same_session_technical_review
    - independent_review
  same_session_iteration_allowed: true
  review_requires_subject_committed_before_review: true
  review_requires_separate_commit_after_subject_commit: true
  review_may_modify_committed_subject: false
  review_may_execute_readiness_audit: false
  independent_reviewer_required: false
  substantive_pass_requirements_identical_across_review_modes: true
  non_exposure_tool_output_nonconformance:
    invalidates_allowlist_subject: false
    requires_new_allowlist_version: false
    invalidates_review_if_corrected_before_substantive_verdict: false
    stop_current_command_only: true
    retry_same_exact_path_with_smaller_output_allowed: true
    scope_expansion_allowed: false
  new_allowlist_version_required_after:
    - substantive_allowlist_scope_defect
    - substantive_allowed_operation_defect
    - substantive_prohibition_or_stop_policy_defect
    - substantive_protected_period_boundary_defect
    - protected_or_analytical_content_exposure

same_session_step_sequence_policy:
  exact_order:
    - step_4_commit_allowlist_and_structural_test
    - step_5_commit_allowlist_review_verdict
    - step_6_execute_read_only_audit_and_commit_result
  each_step_requires_separate_commit: true
  step_6_may_start_only_after_step_5_pass_commit: true
  step_6_may_use_same_conversation_context: true
  step_6_may_modify_allowlist_or_review: false
  step_6_model_fit_refit_inference_or_prediction_allowed: false
  non_exposure_tool_output_nonconformance:
    invalidates_audit: false
    requires_new_allowlist_version: false
    requires_new_context: false
    stop_current_command_only: true
    retry_same_exact_path_with_smaller_output_allowed: true
    scope_expansion_allowed: false

