protected_period_boundary:
  protected_feature_years: [2021, 2022, 2023, 2024]
  default_deny_content_roots:
    - data
    - reports
    - notebooks
    - artifacts
    - outputs
  exact_development_only_exceptions_must_be_listed_below: true
  notebooks_have_no_exceptions: true
  path_not_exactly_allowed_is_denied: true
  symlink_targets_are_denied: true
  path_inventory_does_not_authorize_content_read: true
  protected_schema_row_count_distribution_or_sample_access_allowed: false
  exact_existence_or_opaque_sha256_only:
    - path: data/reports/x_t_pit_v1_revenue_manual_review.csv
      reason: known_incident_v1_0_0_source_may_contain_protected_rows
      permitted_operations: [file_exists, opaque_byte_level_sha256]
    - path: data/reports/sec_facts_sanity_warnings.csv
      reason: known_incident_v1_0_0_and_v1_1_0_source_may_contain_protected_rows
      permitted_operations: [file_exists, opaque_byte_level_sha256]

