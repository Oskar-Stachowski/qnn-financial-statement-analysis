  allowed_verdicts: [MODEL_EXECUTION_V1_2_INTEGRITY_PASS, MODEL_EXECUTION_V1_2_INTEGRITY_FAIL]
  pass_requires_all:
    - execution_contract_and_runner_hashes_match_committed_manifests
