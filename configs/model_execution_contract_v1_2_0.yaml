    - deterioration_score_at_least_4
    - operating_performance_max_D1_D2_alternative_score_at_least_3
  hyperparameters_feature_block_and_family_frozen: true
  retuning_allowed: false
  robustness_training_seed: 20260818
  qnn_structural_runs_if_qnn_feasible:
