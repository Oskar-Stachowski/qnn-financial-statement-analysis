  version: 1.0.0
  status: frozen
  frozen_on: 2026-08-18
  freeze_scope: target_definition_and_pit_b_extraction
  dataset_frozen: false
  feature_pipeline_frozen: false
  research_universe_frozen: false
  signals:
    D1_roa_drop_pp: 0.03
    D2_ocf_assets_drop_pp: 0.03
    D3_current_ratio_relative_drop: 0.20
    D4_liabilities_assets_increase_pp: 0.10
    D5_revenues_relative_drop: 0.10
  target:
    score: deterioration_score_1y
    positive_if_score_at_least: 3
  mandatory_robustness_checks:
    score_thresholds: [2, 4]
    operating_performance:
      definition: max(D1_roa, D2_ocf_assets)
