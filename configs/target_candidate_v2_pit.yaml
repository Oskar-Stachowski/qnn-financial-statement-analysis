scope:
  feature_year_start: 2011
  feature_year_end: 2022
  train_end_year: 2020
  validation_years: [2021, 2022]
  # Reserved for later model evaluation and excluded from the PIT-B
  # reconstruction, freeze-gate, and revenue-resolver audit. Preliminary
  # pre-PIT descriptive analyses had already summarized these years, so they
  # are not a fully unseen holdout for target-definition diagnostics. Do not
  # build or evaluate PIT-B test labels before the formal target freeze.
  test_years: [2023, 2024]
  allowed_forms: [10-K]
  annual_period_min_days: 300
  annual_period_max_days: 400
  period_start_tolerance_days: 14
  minimum_denominator_usd: 1000.0

# The order below is methodological, not coverage-driven. A strategy may be
# used only when it represents both the comparative and current periods in the
# same t+1 anchor accession. Cross-tag substitution is disabled unless the
# strategy explicitly lists an equivalence group.
primitive_concepts:
  assets:
    period_type: instant
    strategies:
      - name: assets_direct
        priority: 1
        concepts: [Assets]
        equivalence_group: consolidated_assets
      - name: balance_total_as_assets
        priority: 2
        concepts: [LiabilitiesAndStockholdersEquity]
        equivalence_group: consolidated_assets

  liabilities:
    period_type: instant
    strategies:
      - name: liabilities_direct
        priority: 1
        concepts: [Liabilities]
        equivalence_group: consolidated_liabilities
      - name: total_less_equity_including_nci
        priority: 2
        derived: subtraction
        minuend: LiabilitiesAndStockholdersEquity
        subtrahend: StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
        equivalence_group: consolidated_liabilities
      # StockholdersEquity excludes NCI in some taxonomies.  The fallback is
      # therefore valid only when no non-zero MinorityInterest is reported for
      # either selected annual instant.  It is never chosen merely for coverage.
      - name: total_less_stockholders_equity_without_nci
        priority: 3
        derived: subtraction
        minuend: LiabilitiesAndStockholdersEquity
        subtrahend: StockholdersEquity
        equivalence_group: consolidated_liabilities
        requires_zero_or_absent_concepts: [MinorityInterest]

  current_assets:
    period_type: instant
    strategies:
      - name: current_assets_direct
        priority: 1
        concepts: [AssetsCurrent]

  current_liabilities:
    period_type: instant
    strategies:
      - name: current_liabilities_direct
        priority: 1
        concepts: [LiabilitiesCurrent]

  revenues:
    period_type: duration
    material_concept_disagreement_ratio: 0.02
    resolver: primary_income_statement_fail_closed
    # A tag is only an allowed candidate. Selection additionally requires the
    # same tag and both annual values on one admissible consolidated revenue
    # row in the SEC-rendered primary income/operations statement identified
    # by FilingSummary.xml. Component/segment/note rows never qualify. Missing
    # or non-unique statement evidence yields ambiguous/NA, never a fallback.
    strategies:
      - name: contract_revenue_excluding_tax
        priority: 1
        concepts: [RevenueFromContractWithCustomerExcludingAssessedTax]
        equivalence_group: consolidated_revenue
      - name: sales_revenue_net
        priority: 2
        concepts: [SalesRevenueNet]
        equivalence_group: consolidated_revenue
      - name: revenues_general
        priority: 3
        concepts: [Revenues]
        equivalence_group: consolidated_revenue
      - name: contract_revenue_including_tax
        priority: 4
        concepts: [RevenueFromContractWithCustomerIncludingAssessedTax]
        equivalence_group: consolidated_revenue
      # Goods/services concepts are acceptable only when the complementary
      # concept is absent from both annual periods in the accession. Otherwise
      # each is only a component and cannot stand in for consolidated revenue.
      - name: goods_revenue_only
        priority: 5
        concepts: [SalesRevenueGoodsNet]
        equivalence_group: consolidated_revenue
        requires_absent_concepts: [SalesRevenueServicesNet]
      - name: services_revenue_only
        priority: 6
        concepts: [SalesRevenueServicesNet]
        equivalence_group: consolidated_revenue
        requires_absent_concepts: [SalesRevenueGoodsNet]

  net_income:
    period_type: duration
    strategies:
      - name: net_income_loss
        priority: 1
        concepts: [NetIncomeLoss]
      - name: profit_loss_including_nci
        priority: 2
        concepts: [ProfitLoss]

  operating_cash_flow:
    period_type: duration
    strategies:
      - name: operating_cash_flow_total
        priority: 1
        concepts: [NetCashProvidedByUsedInOperatingActivities]
      - name: operating_cash_flow_continuing
        priority: 2
        concepts: [NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]

