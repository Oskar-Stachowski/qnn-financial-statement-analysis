  # Company Facts does not contain filing narrative. Material, multi-primitive
  # rebasing which is not in the confirmed registry is therefore ambiguous,
  # never a negative target. Thresholds are data-quality rules, not target
  # thresholds and are not optimized against model outcomes.
  ambiguity_screen:
    minimum_material_components: 2
    balance_sheet_relative_change: 0.50
    revenues_relative_change: 0.50
    income_or_ocf_change_to_assets: 0.20

# Some filer-created XBRL facts reverse the sign of a signed flow when the same
# annual amount is repeated as a comparative.  An exact cross-vintage sign
# inversion is not treated as an economic revision: the B value is unresolved
# without presentation/context metadata and the observation remains NA.
semantic_vintage_validation:
  signed_primitives: [net_income, operating_cash_flow]
  sign_inversion_relative_tolerance: 1.0e-9
  minimum_absolute_value_usd: 1000.0
