findings:
  - id: ALLOWLIST-REVIEW-001
    severity: BLOCKER
    category: allowed_operations
    summary: independent_review_cannot_commit_required_review_evidence
    evidence:
      - allowed_operations.independent_review permits writing and diffing the exact review outputs but omits an exact commit operation
      - entry_conditions_for_audit requires committed review evidence
      - controlling runbook step 5 requires the versioned verdict to be committed regardless of outcome
    impact: no reviewer can both stay inside the declared operation scope and complete step 5
    required_remediation:
      - issue a new allowlist version from step 4
      - add an exact commit operation limited to the two review output paths
      - extend the structural test to enforce consistency between required committed evidence and review operations

  - id: ALLOWLIST-REVIEW-002
    severity: BLOCKER
    category: stop_policy
    summary: allowlist_violation_incident_action_is_not_executable_within_review_scope
    evidence:
      - stop_policy.on_allowlist_violation requires a new versioned incident declaration
      - exact_write_allowlist_for_review permits only the two review verdict files
      - expanding the allowlist during review is explicitly forbidden
    impact: after a review-scope violation the reviewer cannot satisfy the declared stop action without causing a second scope violation
    required_remediation:
      - define a fail-closed escalation that is executable without protected-content access or silent scope expansion
      - distinguish non-analytical review-process nonconformance from unexpected protected-content exposure
      - test that every mandatory stop action has a permitted exact operation and output route

